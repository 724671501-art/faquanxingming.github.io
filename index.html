<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法权测名｜测算系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","宋体";}
        body{background:#f8f3e8;padding:22px;max-width:920px;margin:0 auto;}
        .wrap{background:#fff;border:2px solid #c81623;border-radius:10px;padding:28px;box-shadow:0 0 14px #ebd0d0;}
        h2{text-align:center;color:#c81623;margin-bottom:22px;letter-spacing:3px;font-size:22px;}
        .input-box{margin-bottom:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
        label{font-size:15px;color:#333;}
        input{padding:9px 13px;border:1px solid #ccc;border-radius:5px;font-size:16px;width:170px;}
        button{padding:10px 24px;background:#c81623;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:15px;transition:0.2s;}
        button:hover{background:#a10f1b;}
        #result{margin-top:28px;line-height:1.9;font-size:15px;}
        .item{padding:12px;border-bottom:1px dashed #dddddd;margin-bottom:8px;}
        .red{color:#c81623;font-weight:bold;}
        .green{color:#008833;font-weight:bold;}
        .gray{color:#666;}
        .tip-box{background:#fef3f3;padding:10px;margin:15px 0;border-left:5px solid #c81623;font-size:14px;line-height:1.7;}
    </style>
</head>
<body>
<div class="wrap">
    <h2>法权测名｜测算系统</h2>
    <div class="input-box">
        <label>姓氏：</label>
        <input type="text" id="xing" placeholder="如：王、李、张">
        <label>名字：</label>
        <input type="text" id="ming" placeholder="单名/双名：伟 / 俊杰">
        <button onclick="calcName()">一键测算解析</button>
    </div>
    <div class="tip-box">
        茅山乾坤门显法堂弟子内部使用，请勿外传，违者必究。
    </div>
    <div id="result"></div>
</div>

<script>
const API_BASE = 'http://localhost:5000/api';

function getJiXingHtml(jixing) {
    if(jixing === '吉') return "<span class='green'>【吉】</span>";
    if(jixing === '凶') return "<span class='red'>【凶】</span>";
    return "<span class='gray'>【平】</span>";
}

async function calcName() {
    let xingStr = document.getElementById("xing").value.trim();
    let mingStr = document.getElementById("ming").value.trim();
    
    if(!xingStr || !mingStr) {
        alert("请填写姓氏与名字！");
        return;
    }

    let resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "<div class='item'>正在测算中...</div>";

    try {
        const response = await fetch(`${API_BASE}/calculate-name`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                surname: xingStr,
                given_name: mingStr
            })
        });

        const data = await response.json();

        if(!data.success) {
            resultDiv.innerHTML = `<div class='item'><span class='red'>【错误】${data.error}</span></div>`;
            return;
        }

        const result = data.data;
        let resHtml = "";

        resHtml += `<div class="item"><span class='red'>【基础信息】</span><br>姓名：${result.name}｜姓氏康熙笔画：${result.surname_stroke}｜名字：${result.given_name}${result.is_single_name?"（单名）":"（双名）"}</div>`;

        resHtml += `<div class="item">
        <span class='red'>【六格数理详解】</span><br>
        天格${result.liu_ge.天格.value}：${result.liu_ge.天格.wuxing} ${getJiXingHtml(result.liu_ge.天格.jixing)} → ${result.liu_ge.天格.description}<br>
        人格${result.liu_ge.人格.value}：${result.liu_ge.人格.wuxing} ${getJiXingHtml(result.liu_ge.人格.jixing)} → ${result.liu_ge.人格.description}<br>
        地格${result.liu_ge.地格.value}：${result.liu_ge.地格.wuxing} ${getJiXingHtml(result.liu_ge.地格.jixing)} → ${result.liu_ge.地格.description}<br>
        中变格${result.liu_ge.变格.value}：${result.liu_ge.变格.wuxing} ${getJiXingHtml(result.liu_ge.变格.jixing)} → ${result.liu_ge.变格.description}<br>
        外格${result.liu_ge.外格.value}：${result.liu_ge.外格.wuxing} ${getJiXingHtml(result.liu_ge.外格.jixing)} → ${result.liu_ge.外格.description}<br>
        总格${result.liu_ge.总格.value}：${result.liu_ge.总格.wuxing} ${getJiXingHtml(result.liu_ge.总格.jixing)} → ${result.liu_ge.总格.description}
        </div>`;

        resHtml += `<div class="item">
        <span class='red'>【三才配置：${result.san_cai.key}】</span><br>
        天【${result.san_cai.tian_wuxing}】→人【${result.san_cai.ren_wuxing}】→地【${result.san_cai.di_wuxing}】<br>
        配置注解：${result.san_cai.note || '暂无详解'}
        </div>`;

        resHtml += `<div class="item"><span class='red'>【综合姓名总评】</span><br>${result.evaluation.total_eval}<br>有效吉格数量：${result.evaluation.good_count}/${result.evaluation.total_count}</div>`;

        resultDiv.innerHTML = resHtml;

    } catch (error) {
        resultDiv.innerHTML = `<div class='item'><span class='red'>【错误】网络请求失败，请检查后端服务是否正常运行</span></div>`;
        console.error('Error:', error);
    }
}
</script>
</body>
</html>
