<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法权测名｜测算系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","宋体";}
        body{background:#f8f3e8;padding:22px;max-width:920px;margin:0 auto;}
        .wrap{background:#fff;border:2px solid #c81623;border-radius:10px;padding:28px;box-shadow:0 0 14px #ebd0d0;}
        h2{text-align:center;color:#c81623;margin-bottom:22px;letter-spacing:3px;font-size:22px;}
        .input-box{margin-bottom:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
        label{font-size:15px;color:#333;}
        input{padding:9px 13px;border:1px solid #ccc;border-radius:5px;font-size:16px;width:170px;}
        button{padding:10px 24px;background:#c81623;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:15px;transition:0.2s;}
        button:hover{background:#a10f1b;}
        #result{margin-top:28px;line-height:1.9;font-size:15px;}
        .item{padding:12px;border-bottom:1px dashed #dddddd;margin-bottom:8px;}
        .red{color:#c81623;font-weight:bold;}
        .green{color:#008833;font-weight:bold;}
        .gray{color:#666;}
        .tip-box{background:#fef3f3;padding:10px;margin:15px 0;border-left:5px solid #c81623;font-size:14px;line-height:1.7;}
    </style>
</head>
<body>
<div class="wrap">
    <h2>法权测名｜测算系统</h2>
    <div class="input-box">
        <label>姓氏：</label>
        <input type="text" id="xing" placeholder="如：王、李、张">
        <label>名字：</label>
        <input type="text" id="ming" placeholder="单名/双名：伟 / 俊杰">
        <button onclick="calcName()">一键测算解析</button>
    </div>
    <div class="tip-box">
        茅山乾坤门显法堂弟子内部使用，请勿外传，违者必究。
    </div>
    <div id="result"></div>
</div>

<script>

    //氵4画
    "清":12,"江":7,"浩":11,"涵":12,"泽":17,
    //扌4画
    "扬":7,"振":11,"护":8,"拓":9,
    //艹6画
    "芳":10,"蓉":16,"茵":12,"荣":14,
    //辶7画

    //肉月6画

//【2.吉凶数理】
const luckyArr = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,61,63,65,67,68,81];

//【3.尾数转五行阴阳】
function getWuxing(num){
    let last = num%10;
    const wxMap = {
        1:"阳木",2:"阴木",3:"阳火",4:"阴火",5:"阳土",6:"阴土",7:"阳金",8:"阴金",9:"阳水",0:"阴水"
    }
    return wxMap[last];
}

//【4.吉凶标记】
function getJiXing(num){
    if(luckyArr.includes(num)) return "<span class='green'>【吉】</span>";
    if(badArr.includes(num)) return "<span class='red'>【凶】</span>";
    return "<span class='gray'>【平】</span>";
}

"金金土":"大吉：土生金旺，家底扎实，理财聚财能力出众",

//【6.主测算逻辑】
function calcName(){
    let xingStr = document.getElementById("xing").value.trim();
    let mingStr = document.getElementById("ming").value.trim();
    if(!xingStr || !mingStr){alert("请填写姓氏与名字！");return;}
    let resHtml = "";
    let X = strokeDict[xingStr]||0;
    let nameArr = mingStr.split("");
    let Y,Z=0;
    if(nameArr.length===1){
        Y = strokeDict[nameArr[0]]||0;
    }else{
        Y = strokeDict[nameArr[0]]||0;
        Z = strokeDict[nameArr[1]]||0;
    }
    if(X===0||Y===0){
        resHtml += `<div class='item'><span class='red'>【提示】当前字暂无康熙笔画数据，可在代码strokeDict里补充汉字笔画</span></div>`;
        document.getElementById("result").innerHTML=resHtml;
        return;
    }

    //六格运算
    let tianGe,renGe,diGe,bianGe,waiGe,zongGe;
    if(nameArr.length===1){
        tianGe = X+1;
        renGe = X+Y;
        diGe = Y+1;
        bianGe = X+Y;
        waiGe = 2;
        zongGe = X+Y;
    }else{
        tianGe = X+1;
        renGe = X+Y;
        diGe = Y+Z;
        bianGe = X+Z;
        waiGe = Z+1;
        zongGe = X+Y+Z;
    }

    //三才组合
    let tianWxShort = getWuxing(tianGe).slice(1);
    let renWxShort = getWuxing(renGe).slice(1);
    let diWxShort = getWuxing(diGe).slice(1);
    let sanCaiKey = tianWxShort+renWxShort+diWxShort;
    let sanCaiNote = sanCaiDict[sanCaiKey];

    //输出排版
    resHtml += `<div class="item"><span class='red'>【基础信息】</span><br>姓名：${xingStr}${mingStr}｜姓氏康熙笔画：${X}｜名字：${mingStr}${nameArr.length==1?"（单名）":"（双名）"}</div>`;

    resHtml += `<div class="item">
    <span class='red'>【六格数理详解】</span><br>
    天格${tianGe}：${getWuxing(tianGe)} ${getJiXing(tianGe)} → 祖辈、早年先天运势<br>
    人格${renGe}：${getWuxing(renGe)} ${getJiXing(renGe)} → 主运、性格、中年核心运势<br>
    地格${diGe}：${getWuxing(diGe)} ${getJiXing(diGe)} → 家庭、子女、前运环境<br>
    中变格${bianGe}：${getWuxing(bianGe)} ${getJiXing(bianGe)} → 潜藏变数、暗藏隐性运势<br>
    外格${waiGe}：${getWuxing(waiGe)} ${getJiXing(waiGe)} → 人际、外缘、贵人运<br>
    总格${zongGe}：${getWuxing(zongGe)} ${getJiXing(zongGe)} → 一生晚运、整体终局
    </div>`;

    resHtml += `<div class="item">
    <span class='red'>【三才配置：${sanCaiKey}】</span><br>
    天【${getWuxing(tianGe)}】→人【${getWuxing(renGe)}】→地【${getWuxing(diGe)}】<br>
    配置注解：${sanCaiNote}
    </div>`;

    //综合评级
    let checkArr = [tianGe,renGe,diGe,waiGe,zongGe];
    let goodNum = checkArr.filter(v=>luckyArr.includes(v)).length;
    let totalEval = "";
    if(goodNum>=4 && sanCaiNote.indexOf("大吉")>-1) totalEval="✅上等吉名：五格多吉+三才顺生，名字格局上乘，助运旺财";
    else if(goodNum>=3) totalEval="◎中上吉名：大半格局吉利，人生整体平顺，小瑕无碍大局";
    else if(goodNum>=2) totalEval="△普通平名：吉凶参半，人生起伏不定，靠后天修养弥补不足";
    else totalEval="❌下等凶名：凶数居多，三才不利，建议更换名字优化运势";

    resHtml += `<div class="item"><span class='red'>【综合姓名总评】</span><br>${totalEval}<br>有效吉格数量：${goodNum}/5</div>`;
    document.getElementById("result").innerHTML = resHtml;
}
</script>
</body>
</html>
