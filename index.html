<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法权测名 六格+三才姓名测算</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑","宋体";}
        body{background:#f8f3e8;padding:20px;max-width:900px;margin:0 auto;}
        .wrap{background:#fff;border:2px solid #c81623;border-radius:8px;padding:25px;box-shadow:0 0 12px #e8c9c9;}
        h2{text-align:center;color:#c81623;margin-bottom:20px;letter-spacing:2px;}
        .input-box{margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
        label{font-size:15px;color:#333;}
        input{padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:16px;width:160px;}
        button{padding:9px 22px;background:#c81623;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:15px;}
        button:hover{background:#a0101c;}
        #result{margin-top:25px;line-height:1.8;font-size:15px;}
        .item{padding:10px;border-bottom:1px dashed #ddd;}
        .red{color:#c81623;font-weight:bold;}
        .green{color:#096;}
        .gray{color:#888;}
        .title-tip{background:#fef2f2;padding:8px;margin:12px 0;border-left:4px solid #c81623;}
    </style>
</head>
<body>
<div class="wrap">
    <h2>法权测名六格三才测算系统</h2>
    <div class="input-box">
        <label>姓氏：</label>
        <input type="text" id="xing" placeholder="例：张">
        <label>名字：</label>
        <input type="text" id="ming" placeholder="单名/双名，例：伟 / 明辉">
        <button onclick="calcName()">一键测算</button>
    </div>
    <div class="title-tip">测算规则：康熙繁体笔画｜氵4/扌4/艹6/辶7/肉月6｜六格+三才+81数理吉凶</div>
    <div id="result"></div>
</div>

<script>
//1、内置常用字康熙笔画库（可后续扩充字库）
const strokeDict = {
    //常用姓氏
    "张":11,"李":7,"王":4,"刘":15,"陈":16,"杨":13,"黄":12,"赵":14,"周":8,"吴":7,
    //常用名+偏旁折算字
    "清":12,"江":7,"扬":7,"芳":10,"达":10,"服":8,"明":8,"伟":11,"辉":15,"华":14,"静":16
}

//2、81吉凶数组
const luckyArr = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,61,63,65,67,68,81];
const badArr = [2,4,9,10,12,14,19,20,22,26,28,34,42,43,44,46,54,56,59,60,62,64,66,69,70,71,72,74,76,79,80];

//3、尾数转五行
function getWuxing(num){
    let last = num%10;
    let map = {
        1:"阳木",2:"阴木",3:"阳火",4:"阴火",5:"阳土",6:"阴土",7:"阳金",8:"阴金",9:"阳水",0:"阴水"
    }
    return map[last];
}

//4、数理吉凶
function getJiXing(num){
    if(luckyArr.includes(num)) return "<span class='green'>【吉】</span>";
    if(badArr.includes(num)) return "<span class='red'>【凶】</span>";
    return "<span class='gray'>【平】</span>";
}

//5、三才配置吉凶对照表
const sanCaiDict = {
    "木木木":"大吉：三才连续相生，早年根基佳、一生安稳有福，事业稳步上升",
    "木木火":"大吉：木生火，长辈助力足，人缘佳，财运顺遂",
    "木火土":"大吉：木火土连环相生，身心健康，中年发达家宅兴旺",
    "木火水":"大凶：火被水克，健康不稳，波折多，事业易半途受阻",
    "火火土":"大吉：火生土，踏实稳重，财运稳健，家庭和睦",
    "火土金":"大吉：火生土土生金，白手起家，晚年富贵安稳",
    "土土土":"中吉：土气厚重，性格忠厚平稳，小富即安",
    "金金木":"大凶：金克木，内外矛盾多，劳碌破财，人际隔阂",
    "水水木":"大吉：水生木，智慧出众，贵人多助，学业事业佳"
}

//6、主测算函数
function calcName(){
    let xingStr = document.getElementById("xing").value.trim();
    let mingStr = document.getElementById("ming").value.trim();
    if(!xingStr||!mingStr){alert("请输入姓名！");return;}
    let resHtml = "";
    //取笔画
    let X = strokeDict[xingStr]||0;
    let nameArr = mingStr.split("");
    let Y,Z=0;
    if(nameArr.length===1){
        Y = strokeDict[nameArr[0]]||0;
    }else{
        Y = strokeDict[nameArr[0]]||0;
        Z = strokeDict[nameArr[1]]||0;
    }
    if(X===0||Y===0){resHtml+="<div class='item'><span class='red'>缺少该字康熙笔画数据，需补充字库</span></div>";document.getElementById("result").innerHTML=resHtml;return;}

    //六格计算
    let tianRen,renGe,diGe,bianGe,waiGe,zongGe;
    let sanCaiStr;
    if(nameArr.length===1){
        //单姓单名
        tianRen = X+1;
        renGe = X+Y;
        diGe = Y+1;
        bianGe = X+Y;
        waiGe = 2;
        zongGe = X+Y;
    }else{
        //单姓双名
        tianRen = X+1;
        renGe = X+Y;
        diGe = Y+Z;
        bianGe = X+Z;
        waiGe = Z+1;
        zongGe = X+Y+Z;
    }

    //三才五行拼接
    let tianWx = getWuxing(tianRen).slice(1);
    let renWx = getWuxing(renGe).slice(1);
    let diWx = getWuxing(diGe).slice(1);
    sanCaiStr = tianWx+renWx+diWx;
    let sanCaiDesc = sanCaiDict[sanCaiStr]||"【平配】三才无固定吉凶，需结合八字细看五行旺衰";

    //拼装输出
    resHtml += `<div class="item"><span class='red'>【基础信息】</span><br>姓名：${xingStr}${mingStr}｜姓氏笔画：${X}｜名字：${mingStr}${nameArr.length==1?"(单名)":"(双名)"}</div>`;

    resHtml += `<div class="item">
    <span class='red'>【六格明细】</span><br>
    天格(${tianRen})：${getWuxing(tianRen)} ${getJiXing(tianRen)}｜先天祖辈运<br>
    人格(${renGe})：${getWuxing(renGe)} ${getJiXing(renGe)}｜主运性格中年运<br>
    地格(${diGe})：${getWuxing(diGe)} ${getJiXing(diGe)}｜早年家庭基础运<br>
    中变格(${bianGe})：${getWuxing(bianGe)} ${getJiXing(bianGe)}｜姓名暗藏变数<br>
    外格(${waiGe})：${getWuxing(waiGe)} ${getJiXing(waiGe)}｜人际外缘贵人运<br>
    总格(${zongGe})：${getWuxing(zongGe)} ${getJiXing(zongGe)}｜一生终局晚运
    </div>`;

    resHtml += `<div class="item">
    <span class='red'>【三才配置：${sanCaiStr}】</span><br>
    天(${getWuxing(tianRen)})→人(${getWuxing(renGe)})→地(${getWuxing(diGe)})<br>
    配置解析：${sanCaiDesc}
    </div>`;

    //综合简批
    let jiCnt = [tianRen,renGe,diGe,waiGe,zongGe].filter(n=>luckyArr.includes(n)).length;
    let zongPing = "";
    if(jiCnt>=4&&sanCaiDict[sanCaiStr]&&sanCaiDict[sanCaiStr].indexOf("大吉")>-1) zongPing="✅综合评级：上等吉名，五行和顺，格局优良";
    else if(jiCnt>=3) zongPing="◎综合评级：中上，整体平顺，小有缺憾";
    else if(jiCnt>=2) zongPing="△综合评级：普通，起伏不定，后天修养可弥补";
    else zongPing="❌综合评级：偏弱凶格，名字数理不利，建议择字改名";

    resHtml += `<div class="item"><span class='red'>【综合简批】</span><br>${zongPing}<br>吉格数量：${jiCnt}/5格</div>`;

    document.getElementById("result").innerHTML = resHtml;
}
</script>
</body>
</html>
