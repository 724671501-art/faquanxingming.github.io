</div>

// 时辰名称
const hourNames = ['子时', '丑时', '寅时', '卯时', '辰时', '巳时', '午时', '未时', '申时', '酉时', '戌时', '亥时'];

// 显示选项卡
function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector(`.tab-btn[onclick="showTab('${tabId}')"]`).classList.add('active');
}

// 使用当前时间
function useCurrentTime() {
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const hour = Math.floor(now.getHours() / 2) + 1;
    document.getElementById('month').value = month;
    document.getElementById('day').value = Math.min(day, 30);
    document.getElementById('hour').value = hour;
}

// 计算六神索引
function getGodIndex(sum) {
    return sum % 6;
}

// 显示结果
function showResult(god, calcInfo, question = '', questionType = '') {
    let html = `<div class="result-box">`;
    
    // 头部
    html += `<div class="result-header">
        <div class="god-icon">${god.icon}</div>
        <div>
            <div class="god-name">${god.name}</div>
            <div class="god-luck ${god.luckClass}">${god.luck}</div>
        </div>
    </div>`;
    
    // 卦象总结
    html += `<div style="background:rgba(255,100,100,0.1);border-radius:10px;padding:15px;margin-bottom:15px;border-left:4px solid #ff6464;">
        <div style="color:#ff6464;font-weight:bold;margin-bottom:5px;">📊 卦象总结</div>
        <div style="color:#fff;font-size:16px;font-weight:bold;">${god.summary}</div>
    </div>`;
    
    // 计算过程
    html += `<div class="calc-process">
        <strong>计算过程：</strong>${calcInfo}
    </div>`;
    
    // 诗歌
    html += `<div class="poem-box">
        <div class="poem-title">📜 占卜诗曰</div>
        <div class="poem-text">${god.poem}</div>
    </div>`;
    
    // 针对性解析（如果选择了类型）
    if(questionType && god.interpretations && god.interpretations[questionType]) {
        html += `<div style="background:rgba(255,215,0,0.1);border-radius:10px;padding:15px;margin-bottom:15px;border-left:4px solid #ffd700;">
            <div style="color:#ffd700;font-weight:bold;margin-bottom:5px;">🎯 ${questionType}解析</div>
            <div style="color:#fff;font-size:15px;">${god.interpretations[questionType]}</div>
        </div>`;
    } else if(questionType === '') {
        // 如果未选择类型，显示所有类型的简要解析
        html += `<div style="background:rgba(0,170,255,0.1);border-radius:10px;padding:15px;margin-bottom:15px;border-left:4px solid #00aaff;">
            <div style="color:#00aaff;font-weight:bold;margin-bottom:10px;">📋 各方面解析</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">`;
        Object.keys(god.interpretations).forEach(key => {
            const interpretation = god.interpretations[key];
            const shortText = interpretation.length > 30 ? interpretation.substring(0, 30) + '...' : interpretation;
            html += `<div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:6px;font-size:12px;color:#ccc;">
                <span style="color:#00aaff;">${key}：</span>${shortText}
            </div>`;
        });
        html += `</div></div>`;
    }
    
    // 详解
    html += `<div class="detail-box">
        <div class="detail-title">💡 卦象详解</div>
        ${god.detail}
    </div>`;
    
    // 建议
    html += `<div style="background:rgba(100,255,100,0.1);border-radius:10px;padding:15px;margin-bottom:15px;border-left:4px solid #64ff64;">
        <div style="color:#64ff64;font-weight:bold;margin-bottom:10px;">💬 行动建议</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    god.suggestions.forEach(suggestion => {
        html += `<span style="background:rgba(100,255,100,0.2);color:#64ff64;padding:5px 12px;border-radius:20px;font-size:12px;">${suggestion}</span>`;
    });
    html += `</div></div>`;
    
    // 六神状态
    html += `<div class="six-grid">`;
    const currentIndex = sixGods.indexOf(god);
    sixGods.forEach((g, i) => {
        html += `<div class="grid-item ${i === currentIndex ? 'active' : ''}">
            <div class="grid-icon">${g.icon}</div>
            <div class="grid-name">${g.name}</div>
            <div class="grid-luck ${g.luckClass}">${g.luck}</div>
        </div>`;
    });
    html += `</div>`;
    
    html += `</div>`;
    
    document.getElementById('result').innerHTML = html;
}

// 时间占卜
function divineByTime() {
    const month = parseInt(document.getElementById('month').value);
    const day = parseInt(document.getElementById('day').value);
    const hour = parseInt(document.getElementById('hour').value);
    
    // 获取测算类型
    const questionType = document.getElementById('questionType').value;
    
    const sum = month + day + hour;
    const index = getGodIndex(sum);
    const god = sixGods[index];
    
    const hourName = hourNames[(hour-1+12)%12];
    const calcInfo = `${month}月 + ${day}日 + ${hourName}(${hour}) = ${sum} → ${sum} ÷ 6 余 ${sum%6} → ${god.name}`;
    
    showResult(god, calcInfo, '', questionType);
}

// 数字占卜
function divineByNumber() {
    const num = parseInt(document.getElementById('numInput').value);
    
    if(isNaN(num) || num < 1 || num > 99) {
        alert('请输入1-99之间的数字！');
        return;
    }
    
    // 获取测算类型
    const questionType = document.getElementById('questionType').value;
    
    const index = getGodIndex(num);
    const god = sixGods[index];
    
    const calcInfo = `${num} ÷ 6 余 ${num%6} → ${god.name}`;
    
    showResult(god, calcInfo, '', questionType);
}

// 随机占卜
function divineRandom() {
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const hour = Math.floor(now.getHours() / 2) + 1;
    
    // 获取测算类型
    const questionType = document.getElementById('questionType').value;
    
    const sum = month + day + hour;
    const index = getGodIndex(sum);
    const god = sixGods[index];
    
    const hourName = hourNames[(hour-1+12)%12];
    const calcInfo = `当前时间：${month}月${day}日${hourName} → ${month}+${day}+${hour}=${sum} → ${sum}÷6余${sum%6} → ${god.name}`;
    
    showResult(god, calcInfo, '', questionType);
}

// 页面加载时自动使用当前时间
document.addEventListener('DOMContentLoaded', useCurrentTime);
